name: Release

# Push a tag like v0.6.1 to publish a release. HACS needs a full GitHub release
# (not just a tag) to show versions and to be accepted into the default list.

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check that the tag matches the card version
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          FILE_VERSION="$(grep -oP 'const VERSION = "\K[^"]+' dist/smart-sensor-card.js)"
          echo "tag: $TAG, card: $FILE_VERSION"
          [ "$TAG" = "$FILE_VERSION" ] || { echo "Tag and VERSION in dist/smart-sensor-card.js differ"; exit 1; }

      - name: Check JavaScript syntax
        run: node --check dist/smart-sensor-card.js

      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            # release was already published from the GitHub UI: just attach the file
            gh release upload "$GITHUB_REF_NAME" dist/smart-sensor-card.js --clobber
          else
            gh release create "$GITHUB_REF_NAME" dist/smart-sensor-card.js \
              --title "$GITHUB_REF_NAME" --generate-notes
          fi
